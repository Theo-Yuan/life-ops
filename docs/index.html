<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life Ops 知识库</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 640px; margin: 64px auto; padding: 0 24px; line-height: 1.6; color: #222; }
    h1 { font-size: 1.6rem; }
    .grid { display: grid; gap: 16px; margin-top: 32px; }
    a.card { display: block; padding: 20px; border: 1px solid #e2e8f0; border-radius: 10px; text-decoration: none; color: inherit; transition: box-shadow .15s; }
    a.card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.08); }
    a.card h2 { margin: 0 0 4px; font-size: 1.1rem; }
    a.card p { margin: 0; color: #64748b; font-size: .9rem; }
  </style>
</head>
<body>
  <h1>Life Ops 知识库</h1>
  <p>个人学习项目的知识库入口，分为三个领域。</p>
  <div class="grid">
    <a class="card" href="/life-ops/workout/">
      <h2>🏋️ 训练</h2>
      <p>训练科学：强度区间、RPE、渐进超载、减载、动作技术</p>
    </a>
    <a class="card" href="/life-ops/english/">
      <h2>📚 英语</h2>
      <p>IELTS 6.5 + 工作英语：备考、听说读写、学习法</p>
    </a>
    <a class="card" href="/life-ops/finance/">
      <h2>💰 理财</h2>
      <p>财富认知：FIRE、复利、资产配置、定投、税务</p>
    </a>
  </div>
</body>
</html>
