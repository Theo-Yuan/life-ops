<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>个人财富增长助手</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
  <style>
    :root { --sidebar-width: 18rem; --content-max-width: 48rem; --theme-color: #4a90d9; }
    table { display: block; overflow-x: auto; white-space: nowrap; }
  </style>
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-dark-mode@latest/dist/style.min.css">
</head>
<body>
  <div id="app"></div>

  <script>
    window.$docsify = {
      name: '💰 个人财富增长助手',
      repo: 'Theo-Yuan/life-ops',
      basePath: '/life-ops/finance/',
      loadSidebar: true,
      subMaxLevel: 3,
      search: {
        placeholder: '搜索知识库...',
        noData: '没有找到结果',
        depth: 4,
      },
      darkMode: {
        dark: {
          background: '#1a1a2e',
          toggleBtn: '#e2a03f',
        },
        light: {
          background: '#ffffff',
          toggleBtn: '#4a90d9',
        },
      },
      'flexible-alerts': {
        style: 'flat',
      },
      copyCode: {
        buttonText: '复制',
        errorText: '复制失败',
        successText: '已复制',
      },
    };
  </script>

  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@latest/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-dark-mode@latest/dist/index.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-flexible-alerts@latest/dist/docsify-flexible-alerts.min.js"></script>

  <style>
    :root {
      --theme-color: #4a90d9;
    }
    .sidebar-nav li {
      font-size: 15px;
    }
    .sidebar-nav li li {
      font-size: 14px;
    }
    .markdown-section h1 {
      font-size: 1.8rem;
    }
    .markdown-section h2 {
      font-size: 1.4rem;
      border-bottom: 1px solid #eee;
      padding-bottom: 0.3rem;
    }
    .markdown-section h3 {
      font-size: 1.15rem;
    }
    .markdown-section table {
      display: table;
      width: 100%;
    }
    .markdown-section blockquote {
      border-left: 4px solid var(--theme-color);
      color: #666;
    }
    .sidebar {
      padding-top: 0;
    }
    .sidebar > h1 {
      margin: 0;
      padding: 1rem 1rem 0.5rem;
      font-size: 1.4rem;
      text-align: center;
    }
    .sidebar > h1 a {
      color: var(--theme-color);
    }
    .app-nav {
      display: none;
    }
  </style>
</body>
</html>
